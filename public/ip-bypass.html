<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧创云 - 访问验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #C41E3A 0%, #8B0000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #C41E3A;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }
        h1 {
            color: #1A1A1A;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #C41E3A;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #C41E3A;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(196, 30, 58, 0.4);
        }
        .tip {
            background: #FFF8E1;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
        }
        .tip h3 {
            color: #FF9800;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .tip ul {
            color: #8D6E63;
            font-size: 13px;
            list-style: none;
            padding-left: 0;
        }
        .tip li {
            margin-bottom: 5px;
            padding-left: 15px;
            position: relative;
        }
        .tip li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: #FF9800;
        }
        .error {
            color: #C41E3A;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎭</div>
        <h1>剧创云 - 访问验证</h1>
        <p>请输入下方显示的IP地址，完成访问验证</p>
        
        <div class="input-group">
            <label for="ip">IP地址</label>
            <input type="text" id="ip" placeholder="例如: 117.136.10.237" />
        </div>
        
        <button class="btn" onclick="submitIP()">确认访问</button>
        <div class="error" id="error">请输入IP地址</div>
        
        <div class="tip">
            <h3>💡 操作提示</h3>
            <ul>
                <li>在公网访问页面找到 "This tunnel is hosted by:" 后面的IP</li>
                <li>复制该IP地址粘贴到上方输入框</li>
                <li>点击"确认访问"即可进入系统</li>
                <li>每个IP地址7天内只需验证一次</li>
            </ul>
        </div>
    </div>

    <script>
        function submitIP() {
            var ip = document.getElementById('ip').value.trim();
            var error = document.getElementById('error');
            
            if (!ip) {
                error.style.display = 'block';
                return;
            }
            
            error.style.display = 'none';
            
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = window.location.href;
            form.innerHTML = '<input type="hidden" name="confirm" value="' + ip + '">';
            document.body.appendChild(form);
            form.submit();
        }
        
        document.getElementById('ip').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                submitIP();
            }
        });
    </script>
</body>
</html>
