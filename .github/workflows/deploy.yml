name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # 允许在 Actions 页面手动点按钮重新部署，比赛前想刷新线上版本时用得上
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：读代码 + 发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 用 ci 而不是 install：严格按 package-lock.json 安装，构建结果可复现
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # GitHub Pages 不做 SPA 前端路由回退：直接访问 /materials 这类深层路径会 404。
      # 把 index.html 复制成 404.html 后，未知路径也返回应用本身，交给 vue-router 接管。
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
